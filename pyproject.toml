[tool.poetry]
name = "crypto-radar"
version = "0.1.0"
description = "Personal crypto Derivatives Screener + Narrative Radar with Telegram alerts"
authors = ["zfciquzj <zfciquzj@hi2.in>"]
readme = "README.md"
packages = [{include = "radar", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
aiogram = "^3.13.1"
httpx = "^0.27.2"
tenacity = "^9.0.0"
apscheduler = "^3.10.4"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
aiosqlite = "^0.20.0"
alembic = "^1.13.3"
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
loguru = "^0.7.2"
python-dotenv = "^1.0.1"
polars = "^1.12.0"
feedparser = "^6.0.11"
beautifulsoup4 = "^4.12.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.1"
mypy = "^1.13.0"
types-beautifulsoup4 = "^4.12.0"

[tool.poetry.scripts]
radar = "radar.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
